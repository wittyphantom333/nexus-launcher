name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nexus Launcher ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Installation

            ### Windows
            **Recommended:** Download the `.zip` file, extract it, and run `Nexus Launcher.exe` inside — no installation required, no SmartScreen prompt.

            Alternatively, use the `.exe` installer. If Windows shows **"Windows protected your PC"**:
            1. Click **"More info"**
            2. Click **"Run anyway"**

            ### macOS
            Download the `.dmg`, open it, and drag the app to Applications.

            ### Linux
            Download the `.AppImage`, make it executable (`chmod +x`), and run it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build & Publish (${{ matrix.os }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm run build:win
            artifact_glob: |
              dist/*.exe
              dist/*.zip

          - os: macos-latest
            build_cmd: npm run build:mac
            artifact_glob: |
              dist/*.dmg

          - os: ubuntu-latest
            build_cmd: npm run build:linux
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & package
        run: ${{ matrix.build_cmd }}

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.artifact_glob }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
