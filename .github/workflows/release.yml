name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm run build:win
            artifact_glob: 'dist/*.exe'
            artifact_name: windows

          - os: macos-latest
            build_cmd: npm run build:mac
            artifact_glob: 'dist/*.dmg'
            artifact_name: macos

          - os: ubuntu-latest
            build_cmd: npm run build:linux
            artifact_glob: 'dist/*.AppImage'
            artifact_name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing — Windows (CSC_LINK/CSC_KEY_PASSWORD) and macOS (APPLE_*)
          # Run scripts/generate-cert.ps1 locally to generate CSC_LINK + CSC_KEY_PASSWORD
          # then add them in: Settings → Secrets and variables → Actions
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.build_cmd }}

      # Upload all dist/ files to the GitHub Release
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nexus Launcher ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
